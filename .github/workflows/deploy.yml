name: Build and Push Docker Image

on:
  push:
    branches: [ "main-server" ]

jobs:
  # --- ÉTAPE 1 : LES TESTS ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        # On lance le serveur en arrière-plan (&), on attend 5s qu'il démarre, puis on teste
        run: |
          npm start &
          sleep 5
          npm test
        env:
          # Variables d'environnement "Bouchon" (Mock) pour que le serveur démarre sans erreur
          PORT: 3200
          API_KEY: ${{ secrets.API_KEY }}
          # On met localhost pour éviter que le serveur cherche le vrai Mosquitto
          MQTT_URL: "mqtt://localhost"
          # On met des fausses valeurs pour Gist/GitHub pour ne pas déclencher la vraie mise à jour
          GIST_ID: "test_gist_id"
          GITHUB_TOKEN: "test_github_token"
          # Désactive les logs trop verbeux pendant les tests si tu veux
          NODE_ENV: "test"

  # --- ÉTAPE 2 : BUILD DOCKER (Seulement si les tests passent) ---
  build:
    needs: test  # 👈 C'est cette ligne qui bloque le build si les tests échouent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Important : on cible l'architecture du Raspberry Pi
          platforms: linux/amd64,linux/arm64
          tags: matlacheny/saeiotserver:latest