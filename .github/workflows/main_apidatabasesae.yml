# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - apidatabaseSae

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test
        env:
          # On fournit une clé API bidon pour que les tests puissent démarrer
          # (même si api.test.js l'écrase, c'est une sécurité pour l'initialisation)
          API_KEY: test-secret-key
          DB_USER: fake
          DB_PASSWORD: fake
          DB_SERVER: fake
          DB_NAME: fake
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_291D442DCE5B45BEB96B426907FD4B98 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4D7CA807EDB4B43A45D3E34F0376B4D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF958EE524AE4802BB9D4CCFE08F2178 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apidatabaseSae'
          slot-name: 'Production'
          package: .
          